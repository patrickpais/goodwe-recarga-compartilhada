<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb37a"/>
      <stop offset="1" stop-color="#0f5c3f"/>
    </linearGradient>
    <linearGradient id="raio" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff5c"/>
      <stop offset="1" stop-color="#9dff33"/>
    </linearGradient>
    <clipPath id="corteFolha">
      <path d="M 500 150 C 745 150 790 430 500 690 C 210 430 255 150 500 150 Z"/>
    </clipPath>
  </defs>

  <!-- emblema -->
  <circle cx="500" cy="500" r="490" fill="#131c2e"/>
  <circle cx="500" cy="500" r="462" fill="none" stroke="#9dff33" stroke-width="6" opacity=".9"/>

  <!-- folha (rotacionada) com nervura em raio -->
  <g transform="translate(0,-18) rotate(-28 500 420)">
    <path d="M 500 150 C 745 150 790 430 500 690 C 210 430 255 150 500 150 Z" fill="url(#folha)"/>
    <!-- caule -->
    <path d="M 500 690 L 500 760" stroke="#0f5c3f" stroke-width="22" stroke-linecap="round"/>
    <!-- raio -->
    <g clip-path="url(#corteFolha)">
      <polygon points="545,215 420,445 500,445 455,615 590,385 505,385" fill="url(#raio)"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="500" y="838" text-anchor="middle" font-family="Nunito, 'SF Pro Rounded', ui-rounded, Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="8" fill="#ffffff">ECOVOLTS</text>
  <text x="500" y="880" text-anchor="middle" font-family="Nunito, 'SF Pro Rounded', ui-rounded, Arial, sans-serif" font-weight="800" font-size="19" letter-spacing="4" fill="#9aa1ad">EV CHALLENGE · GOODWE + FIAP 2026</text>
</svg>
